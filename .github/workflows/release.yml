name: Release

# Every merge to main whose pubspec.yaml version (x.y.z+N) has no vX.Y.Z tag yet
# builds the APK and AAB, tags the merge commit, and attaches the APK to a draft
# GitHub Release with the CHANGELOG.md entry as notes. With signing and Play
# secrets, the AAB also goes to Play internal testing as a draft. CI makes every
# PR bump the version, so every merged PR gets its own APK. Manual runs outside
# main only build artifacts.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.8'
  PACKAGE_NAME: 'com.oasisforge.hisscore'
  SLUG: 'hisscore'

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.read.outputs.name }}
      tag: ${{ steps.read.outputs.tag }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the pubspec.yaml version
        id: read
        run: |
          name=$(bash scripts/version.sh name)
          tag="v$name"
          release=false
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Not on main: building $tag without releasing it." >> "$GITHUB_STEP_SUMMARY"
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is already released: nothing to release." >> "$GITHUB_STEP_SUMMARY"
          else
            release=true
          fi
          { echo "name=$name"; echo "tag=$tag"; echo "release=$release"; } >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NAME: ${{ needs.version.outputs.name }}
      TAG: ${{ needs.version.outputs.tag }}
      RELEASE: ${{ needs.version.outputs.release }}
      HAS_PLAY_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Configure release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: signing with a throwaway debug key and skipping Play."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > Hisscore/android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > Hisscore/android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: Hisscore
        run: flutter pub get

      - name: Build app bundle and APK
        working-directory: Hisscore
        run: |
          flutter build appbundle --release
          flutter build apk --release

      # RUN-2: the store listing's data-safety answers depend on the permissions.
      # List the ones the app may declare; any other fails the release.
      - name: Check the APK's permissions
        env:
          ALLOWED: 'android.permission.INTERNET android.permission.POST_NOTIFICATIONS'
        run: |
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          "$aapt2" dump permissions Hisscore/build/app/outputs/flutter-apk/app-release.apk | tee permissions.txt
          unexpected=$(sed -nE "s/^uses-permission(-sdk-23)?: name='([^']+)'.*/\2/p" permissions.txt \
            | grep -v "^${PACKAGE_NAME}\." | grep -vxF -f <(printf '%s\n' $ALLOWED) || true)
          if [ -n "$unexpected" ]; then
            echo "::error::The release APK declares permissions outside the allowed list (RUN-2): $unexpected"
            exit 1
          fi

      - name: Name the files after the version
        run: |
          mkdir -p dist
          cp Hisscore/build/app/outputs/flutter-apk/app-release.apk "dist/$SLUG-$NAME.apk"
          cp Hisscore/build/app/outputs/bundle/release/app-release.aab "dist/$SLUG-$NAME.aab"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ env.TAG }}
          path: dist/
          retention-days: 14

      - name: Write release notes
        if: env.RELEASE == 'true'
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          bash scripts/version.sh notes > release-notes.md
          if [ "$SIGNED" != true ]; then
            printf '\n> This APK is signed with a throwaway debug key, so it cannot update an installed copy. Back up in the app, uninstall, install this APK, then restore.\n' >> release-notes.md
          fi

      # The tag records the release; CI's version check compares PRs against it.
      # A draft release doesn't create its tag, so push it first.
      - name: Tag the release
        if: env.RELEASE == 'true'
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      # Draft: on a public repo the APK stays private until you publish the release.
      - name: Attach APK to a draft GitHub Release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: 'Hisscore ${{ env.NAME }}'
          body_path: release-notes.md
          files: dist/${{ env.SLUG }}-${{ env.NAME }}.apk
          draft: true

      - name: Upload to Play internal testing
        if: env.RELEASE == 'true' && steps.signing.outputs.signed == 'true' && env.HAS_PLAY_CREDENTIALS == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: dist/${{ env.SLUG }}-${{ env.NAME }}.aab
          track: internal
          status: draft
