name: Release

# Every merge to main whose pubspec.yaml version (x.y.z+N) has no vX.Y.Z tag yet
# builds the app, checks the APK's permissions, and tags the merge commit. CI's
# version check compares every PR against that tag, which is why the tag still
# matters even though nothing is published from here.
#
# This workflow does NOT publish. It creates no GitHub Release and uploads nothing
# to Play, by decision: the upload keystore is deliberately kept off CI, so any
# artifact built here is signed with a throwaway debug key and Play would reject
# it. The real, upload-signed AAB is built locally -- see RELEASE.md section 3.
#
# The artifacts attached to a run are unsigned test builds, useful for sideloading
# a specific commit and nothing else.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.8'
  PACKAGE_NAME: 'com.oasisforge.hisscore'
  SLUG: 'hisscore'

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.read.outputs.name }}
      tag: ${{ steps.read.outputs.tag }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the pubspec.yaml version
        id: read
        run: |
          name=$(bash scripts/version.sh name)
          tag="v$name"
          release=false
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Not on main: building $tag without releasing it." >> "$GITHUB_STEP_SUMMARY"
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is already released: nothing to release." >> "$GITHUB_STEP_SUMMARY"
          else
            release=true
          fi
          { echo "name=$name"; echo "tag=$tag"; echo "release=$release"; } >> "$GITHUB_OUTPUT"

  build:
    name: Build and tag
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NAME: ${{ needs.version.outputs.name }}
      TAG: ${{ needs.version.outputs.tag }}
      RELEASE: ${{ needs.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: Hisscore
        run: flutter pub get

      - name: Build app bundle and APK
        working-directory: Hisscore
        run: |
          flutter build appbundle --release
          flutter build apk --release

      # RUN-2: the store listing's data-safety answers depend on the permissions.
      # List the ones the app may declare; any other fails the release.
      - name: Check the APK's permissions
        env:
          ALLOWED: 'android.permission.INTERNET android.permission.ACCESS_NETWORK_STATE android.permission.POST_NOTIFICATIONS android.permission.VIBRATE com.google.android.providers.gsf.permission.READ_GSERVICES'
        run: |
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          "$aapt2" dump permissions Hisscore/build/app/outputs/flutter-apk/app-release.apk | tee permissions.txt
          unexpected=$(sed -nE "s/^uses-permission(-sdk-23)?: name='([^']+)'.*/\2/p" permissions.txt \
            | grep -v "^${PACKAGE_NAME}\." | grep -vxF -f <(printf '%s\n' $ALLOWED) || true)
          if [ -n "$unexpected" ]; then
            echo "::error::The release APK declares permissions outside the allowed list (RUN-2): $unexpected"
            exit 1
          fi

      - name: Name the files after the version
        run: |
          mkdir -p dist
          cp Hisscore/build/app/outputs/flutter-apk/app-release.apk "dist/$SLUG-$NAME.apk"
          cp Hisscore/build/app/outputs/bundle/release/app-release.aab "dist/$SLUG-$NAME.aab"

      # Debug-signed test builds, not release artifacts. The AAB that goes to Play
      # is built locally with the real upload key; see RELEASE.md section 3.
      - name: Upload unsigned test builds
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-test-build-${{ env.TAG }}
          path: dist/
          retention-days: 14

      # The tag is the one thing this workflow still publishes: CI's version
      # check compares every PR against it, so it has to exist.
      - name: Tag the release
        if: env.RELEASE == 'true'
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

